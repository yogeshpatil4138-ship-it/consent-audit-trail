spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: none
  mail:
    host: localhost
    port: 25
    username: ""
    password: ""

app:
  jwt:
    secret: test-secret-please-ignore-this-is-only-for-unit-tests-32chars
    expiration-ms: 3600000
  ai:
    base-url: http://localhost:9999
    timeout-ms: 1000
  seed:
    enabled: false
  cors:
    allowed-origins: http://localhost
