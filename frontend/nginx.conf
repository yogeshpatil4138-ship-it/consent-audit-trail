server {
    # ${PORT} is filled in at container start (Railway assigns it; defaults to 80 locally)
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown paths load the React app
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The browser calls the backend directly (VITE_API_BASE_URL), so no /api proxy here.

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer-when-downgrade;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}